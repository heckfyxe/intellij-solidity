Reports number constants assigned to an integer variable whose type can't hold them, as the compiler does:
<code>uint8 x = 300;</code>, <code>int8 y = -129;</code>, or a fractional constant like <code>uint z = 1 / 2;</code>.
Constants that fold to an integer, like <code>2.5 * 2</code> or <code>0.5 ether</code>, are fine.
