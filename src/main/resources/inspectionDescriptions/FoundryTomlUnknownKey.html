<body>
Reports keys in <code>foundry.toml</code> that forge doesn't know, in <code>[profile.*]</code> tables and in the
standalone tables forge reads, such as <code>[fuzz]</code> and <code>[fmt]</code>. Tables whose keys are your own,
such as <code>[rpc_endpoints]</code> and <code>[etherscan]</code>, are not checked.
